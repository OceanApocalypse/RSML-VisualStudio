name: CI and SonarQube Analysis

on:
  push:
    branches:
      - main
      - dev
      - feat/*
    paths:
      - "src/**"
      - "benchmarks/**"
      - "tests/**"
      - "**/*.csproj"
      - "**/*.slnx"
      - ".github/workflows/ci.yml"
  pull_request:
    branches:
      - main
      - dev
    paths:
      - "src/**"
      - "benchmarks/**"
      - "tests/**"
      - "**/*.csproj"
      - "**/*.slnx"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-analyze:
    name: Test and Analyze
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis
          submodules: recursive

      # .NET Framework 4.7.2 is pre-installed with Visual Studio
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57  # v3

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'zulu'

      - name: Restore
        run: nuget restore RSML.VisualStudio.slnx

      - name: Cache SonarQube Cloud packages
        uses: actions/cache@v5
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache SonarQube Cloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner

      - name: Install SonarQube Cloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        run: |
          mkdir -p ${{ runner.temp }}/scanner
          dotnet tool update dotnet-sonarscanner --tool-path ${{ runner.temp }}/scanner

      - name: Begin analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ${{ runner.temp }}/scanner/dotnet-sonarscanner begin \
            /k:"oas_RedSeaModernLanguage" \
            /o:"oas" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.exclusions="**/*.png,**/*.jpg,**/*.jpeg,**/*.ico,**/*.gif" \
            /d:sonar.qualitygate.wait=true \
            /d:sonar.qualitygate.timeout=250

      - name: Build
        run: msbuild build --configuration Debug --no-restore

      - name: End analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ${{ runner.temp }}/scanner/dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"